name: Financial integrity checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile
      - name: Test financial domain
        run: bun run test:domain
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Build app
        run: bun run build
